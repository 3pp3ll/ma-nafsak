<style>

<title>مع نفسك</title>

<style>
/* Layout: a one-screen app column — top bar, icon-led screens, five-icon bottom nav; motion accents come from the user's chosen theme (--fx1/--fx2). */
:root{
  --outer:#DADDE9; --bg:#E8EAF2; --surface:#F5F5FA; --ink:#1A1F36; --muted:#5E6579; --line:#D5D8E5;
  --brand:#7A42C8; --brand-soft:#E6DCF7; --on-brand:#FFFFFF;
  --hero:#1E1B38; --hero-ink:#F4F2FF; --hero-muted:#B3ACD6;
  --bubble:#E5E0F2; --me:#C8DDF6; --me-ink:#10243F;
  --gold:#E6B370; --gold-ink:#7A5216; --gold-soft:#F4E7D2;
  --prog:#12C26B; --ok:#12924F; --warn:#C2410C;
  --fx1:#8B5CF6; --fx2:#3B82F6;
  --f-display:"Lalezar","IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --outer:#08061C; --bg:#0F0C29; --surface:#1E1B38; --ink:#FFFFFF; --muted:#A1A1AA; --line:#2E2A4D;
  --brand:#8B5CF6; --brand-soft:#2A263C; --on-brand:#FFFFFF;
  --hero:#1A1640; --hero-ink:#FFFFFF; --hero-muted:#A9A3CC;
  --bubble:#2A263C; --me:#1A2B4C; --me-ink:#FFFFFF;
  --gold:#E6B370; --gold-ink:#E6B370; --gold-soft:#3A2E1E;
  --prog:#00E676; --ok:#00E676; --warn:#FB923C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --outer:#08061C; --bg:#0F0C29; --surface:#1E1B38; --ink:#FFFFFF; --muted:#A1A1AA; --line:#2E2A4D;
  --brand:#8B5CF6; --brand-soft:#2A263C; --on-brand:#FFFFFF;
  --hero:#1A1640; --hero-ink:#FFFFFF; --hero-muted:#A9A3CC;
  --bubble:#2A263C; --me:#1A2B4C; --me-ink:#FFFFFF;
  --gold:#E6B370; --gold-ink:#E6B370; --gold-soft:#3A2E1E;
  --prog:#00E676; --ok:#00E676; --warn:#FB923C; color-scheme:dark;}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--fx1);outline-offset:2px}

.app{height:100%;max-width:480px;margin-inline:auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px -30px rgba(0,0,0,.35)}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:14px 8px}
.who small{display:block;color:var(--muted);font-size:.78rem}
.who strong{font-size:1.15rem}
.pts{display:flex;align-items:center;gap:6px;border:0;background:var(--gold-soft);color:var(--gold-ink);font-weight:700;border-radius:99px;padding:5px 12px 5px 8px;font-variant-numeric:tabular-nums;transition:transform .2s}
.pts .i{width:22px;height:22px}
.bump{transform:scale(1.14)}

/* Main + nav */
.main{flex:1;min-height:0;overflow-y:auto;padding-block:6px 22px;display:grid;gap:16px;align-content:start}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:8px 10px}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:4px 0;color:var(--muted);font-size:.72rem;font-weight:500}
.nav .nic{width:46px;height:34px;border-radius:14px;display:grid;place-items:center;transition:background .25s}
.nav .i{width:25px;height:25px}
.nav button[aria-selected="true"]{color:var(--ink);font-weight:700}
.nav button[aria-selected="true"] .nic{background:color-mix(in srgb,var(--fx1) 22%,transparent)}
.nav button[aria-selected="true"] .i{animation:hop .45s ease-out}

/* Icons */
.i{display:block}
.i .ac{fill:var(--fx1);stroke:none}
.i .ac2{fill:var(--fx2);stroke:none}
.i .acs{stroke:var(--fx1)}
.i .soft{fill:color-mix(in srgb,var(--fx1) 28%,transparent);stroke:none}
.i *{transform-box:fill-box;transform-origin:center}
.dot{animation:typing 1.4s infinite}.d2{animation-delay:.18s}.d3{animation-delay:.36s}
.beat{animation:beat 1.6s infinite}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
.tw2{animation:twinkle 2.4s ease-in-out 1.2s infinite}
.rays{animation:spin 14s linear infinite;transform-origin:50% 50%;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.bounce{animation:bob 1.6s ease-in-out infinite}
.wob{animation:wob 3s ease-in-out infinite}
.gspin{animation:spin 8s linear infinite}
.flip{animation:flip 3.2s ease-in-out infinite}
.grow{animation:grow 2.6s ease-in-out infinite;transform-origin:50% 100%}
.drip{animation:drip 1.6s ease-in infinite}
.floaty{animation:floaty 2.4s ease-in-out infinite}
.flick{animation:flick .9s ease-in-out infinite alternate;transform-origin:50% 100%}
.steam{animation:floaty 2s ease-in-out infinite}
.draw{stroke-dasharray:40;animation:dash 2.2s linear infinite}
.roll{animation:spin 6s linear infinite}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-2px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.7) rotate(25deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(18deg)}}
@keyframes flip{0%,70%,100%{transform:scaleX(1)}85%{transform:scaleX(-1)}}
@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.05)}}
@keyframes drip{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(3px);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-2px);opacity:1}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
@keyframes dash{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
@keyframes hop{40%{transform:translateY(-5px) scale(1.12)}}
@keyframes popin{from{transform:scale(.9) translateY(6px);opacity:.35}to{transform:none;opacity:1}}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:grid;justify-items:center;gap:10px;padding:18px 8px 14px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.95rem;animation:popin .45s both;animation-delay:calc(var(--i,0)*55ms);transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .ic{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:color-mix(in srgb,var(--fx1) 15%,var(--surface))}
.tile:nth-child(even) .ic{background:color-mix(in srgb,var(--fx2) 15%,var(--surface))}
.tile .ic .i{width:40px;height:40px}
.tile .sub{font-size:.75rem;font-weight:400;color:var(--muted);margin-top:-6px}
.tile.on::after{content:"";position:absolute;top:12px;inset-inline-start:12px;width:10px;height:10px;border-radius:50%;background:var(--fx1);box-shadow:0 0 0 4px color-mix(in srgb,var(--fx1) 25%,transparent)}

/* Sub header */
.subhead{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.back .i{width:20px;height:20px}
.sh-ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--fx1) 18%,transparent)}
.sh-ic .i{width:24px;height:24px}
.subhead h2{font-size:1.2rem}

/* Home hero */
.hero-card{position:relative;border-radius:28px;background:var(--hero);color:var(--hero-ink);padding:18px;overflow:hidden;display:flex;gap:16px;align-items:center}
.ambient{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:10}
.rfg{fill:none;stroke:var(--prog);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.rnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.rnum b{font-family:var(--f-display);font-weight:400;font-size:2.2rem;color:#FFFFFF}
.rnum span{font-size:.72rem;color:var(--hero-muted)}
.hero-txt{position:relative;display:grid;gap:6px;min-width:0}
.hero-txt .lbl{color:var(--hero-muted)}
.hero-txt b{font-size:1.02rem;line-height:1.45}
.mini{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--hero-muted)}
.mini .i{width:22px;height:22px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;border:0;background:var(--brand);color:var(--on-brand);border-radius:22px;padding:16px;font-weight:700;font-size:1.08rem;box-shadow:0 10px 24px -14px var(--brand)}
.cta .i{width:30px;height:30px}
.cta .i .soft{fill:rgba(255,255,255,.25)}
.nudge{font-size:.88rem;color:var(--muted);text-align:center}
.lbl{font-size:.78rem;color:var(--muted);font-weight:500}

/* Cards, forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}
.big-l{font-weight:700;font-size:1.1rem}
textarea,.field input,.field select,.inp{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px 12px;font-size:.95rem}
textarea{resize:none}
.field{display:grid;gap:6px}
.field > span{font-size:.82rem;font-weight:700}
.btn-brand,.btn-gold,.btn-ghost{border:0;border-radius:14px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-gold{background:var(--gold);color:#2A1A00}
.brandmark{height:38px;width:auto;display:block}
.top .who{display:flex;gap:10px;align-items:center}
.logo-big{width:min(300px,100%);height:auto;display:block;margin-inline:auto}
.modal{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:rgba(8,6,28,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal .card{width:100%;max-width:400px;animation:popin .3s both}
.timer{font-family:var(--f-display);font-size:1.6rem;color:var(--brand);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.key-in{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace}
.sw{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--line);padding:0;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:inset-inline-start .2s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{inset-inline-start:23px}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-brand .i,.btn-gold .i,.btn-ghost .i{width:20px;height:20px;flex:none}
.btn-brand:disabled,.btn-gold:disabled{opacity:.55;cursor:default}
.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip .i{width:20px;height:20px}
.chip[aria-pressed="true"]{border-color:var(--brand);color:var(--ink);font-weight:700;background:var(--brand-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bubble);border-radius:14px;padding:3px}
.seg button{border:0;background:transparent;border-radius:11px;padding:8px 4px;font-size:.88rem;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reply{background:var(--brand-soft);border-radius:22px 22px 22px 8px;padding:16px;display:grid;gap:6px;animation:popin .4s both}
.reply .praise{font-family:var(--f-display);font-size:1.4rem;line-height:1.35;color:var(--brand)}
.reply .you{font-size:.8rem;color:var(--muted)}
.reply .tip{font-size:.9rem;border-top:1px solid var(--line);padding-top:8px}
.result{white-space:pre-wrap;line-height:1.85;font-size:.95rem;min-height:2em}
.thinking{color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem}
.fine{font-size:.76rem;color:var(--muted)}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.row .ric{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--fx1) 15%,transparent)}
.row .ric .i{width:24px;height:24px}
.row .t{font-size:.92rem}
.row .w{font-size:.74rem;color:var(--muted);white-space:nowrap}
.row .x{border:0;background:transparent;color:var(--muted);font-size:.8rem}

/* Chat */
.chat-screen{display:flex;flex-direction:column;gap:10px;min-height:100%}
.modes{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mode{flex:none;display:grid;justify-items:center;gap:4px;border:0;background:transparent;font-size:.75rem;color:var(--muted);width:64px}
.mode .mi{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.mode .i{width:28px;height:28px}
.mode[aria-pressed="true"]{color:var(--ink);font-weight:700}
.mode[aria-pressed="true"] .mi{border-color:var(--fx1);background:color-mix(in srgb,var(--fx1) 16%,var(--surface))}
.chat-state{font-size:.72rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.chat-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chat-state.ai::before{background:var(--ok)}
.chat{flex:1;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 13px;border-radius:18px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere;animation:popin .25s both}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-start-start-radius:6px}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-start-end-radius:6px}
.msg.typing{color:var(--muted)}
.msg.note{align-self:center;background:transparent;border:0;color:var(--muted);font-size:.75rem;padding:2px}
.msg .btn-gold{margin-top:8px;padding:7px 12px;font-size:.85rem;display:flex}
.chat-input{position:sticky;bottom:0;display:flex;gap:8px;background:var(--bg);padding-top:6px}
.chat-input input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:11px 16px}
.send{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;padding:0}
.send .i{width:22px;height:22px}

/* Interest page */
.int-hero{display:grid;justify-items:center;gap:10px;padding:22px;border-radius:28px;background:color-mix(in srgb,var(--fx1) 14%,var(--surface));text-align:center}
.int-hero .i{width:84px;height:84px}

/* Games */
.game-head{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:6px}
.dots span{width:26px;height:7px;border-radius:99px;background:var(--line)}
.dots span.on{background:var(--fx1)}
.q{font-size:1.15rem;font-weight:700;line-height:1.5}
.opts{display:grid;gap:8px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px;font-size:1rem;text-align:start}
.opts button.right{border-color:var(--ok);background:var(--brand-soft);color:var(--ok);font-weight:700}
.opts button.wrong{border-color:var(--warn);color:var(--warn);opacity:.7;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.game-msg{min-height:1.6em;font-weight:700;font-size:.92rem}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding-top:20px}
.done .big{font-family:var(--f-display);font-size:2.2rem;color:var(--fx1)}
.arena{position:relative;height:340px;border-radius:24px;background:var(--hero);overflow:hidden}
.runner{position:absolute;width:72px;height:72px;border:0;background:transparent;padding:0;left:calc(50% - 36px);top:calc(50% - 36px);transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 0 14px var(--fx1))}
.runner .i{width:100%;height:100%;animation:twinkle 1s ease-in-out infinite}
.runner.hit .i{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.4) rotate(20deg)}}
.score{font-family:var(--f-display);font-size:1.7rem;color:var(--fx1)}

/* Points & account */
.big-pts{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:20px;display:grid;gap:2px;position:relative;overflow:hidden}
.big-pts b{font-family:var(--f-display);font-weight:400;font-size:3rem;line-height:1.1;color:var(--fx1);font-variant-numeric:tabular-nums}
.big-pts span{font-size:.82rem;color:var(--hero-muted)}
.big-pts .i{position:absolute;inset-inline-start:18px;top:18px;width:64px;height:64px;opacity:.9}
.earn{list-style:none;margin:0;padding:0;font-size:.9rem}
.earn li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.earn b{color:var(--gold-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.link-row{display:flex;gap:6px;align-items:center}
.link-row code{flex:1;min-width:0;direction:ltr;text-align:left;background:var(--bubble);border-radius:12px;padding:8px 12px;font-size:.85rem;user-select:all;overflow:hidden;text-overflow:ellipsis}
.me-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px}
.avatar{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;color:#FFFFFF}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--fx1),var(--fx2),var(--fx1));animation:spin 6s linear infinite}
.avatar::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--hero)}
.avatar span{position:relative;z-index:1}
.me-card .meta{display:grid;min-width:0}
.me-card .meta small{color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:.85rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.picks button .i{width:18px;height:18px}
.picks button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.pal{display:flex;gap:10px;flex-wrap:wrap}
.pal button{width:44px;height:30px;border-radius:99px;border:2px solid var(--line);padding:0}
.pal button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.preview{position:relative;height:190px;border-radius:24px;background:var(--hero);overflow:hidden;display:grid;place-items:center}
.preview canvas{position:absolute;inset:0;width:100%;height:100%}
.preview b{position:relative;font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:#FFFFFF}
.loop{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.loop li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.loop li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.85rem}
.loop span{color:var(--muted);font-size:.9rem;display:block}

/* Top actions, status, community, meetups, admin */
.top-act{display:flex;gap:8px;align-items:center}
.bell{position:relative;width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.bell .i{width:22px;height:22px}
.ring-bell .i{animation:wob .45s ease-in-out 3}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--warn);color:#FFFFFF;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.avatar img{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;object-fit:cover}
.sdot{position:absolute;bottom:1px;inset-inline-start:1px;width:16px;height:16px;border-radius:50%;border:3px solid var(--surface);z-index:2;background:var(--ok)}
.sdot.busy,.sdot-inline.busy{background:var(--warn)}
.sdot.off,.sdot-inline.off{background:var(--muted)}
.sdot-inline{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.status-row{display:flex;gap:8px;flex-wrap:wrap}
.idtag{direction:ltr;unicode-bidi:isolate;font-size:.78rem;background:var(--bubble);border-radius:8px;padding:2px 8px;width:max-content;font-variant-numeric:tabular-nums}
.tile .sub.soon{color:var(--gold-ink);background:var(--gold-soft);border-radius:99px;padding:1px 10px;font-weight:700;margin-top:-4px}
.tile.dim .ic{filter:grayscale(.7);opacity:.65}
button.row{width:100%;text-align:start;cursor:pointer}
.fav{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fx2) 20%,var(--surface));font-weight:700}
.fav .sdot{width:13px;height:13px;border-width:2px}
.seats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.seat{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;border:2px dashed var(--line);color:var(--muted);text-align:center;line-height:1.2;overflow:hidden}
.seat.acc{border-style:solid;border-color:var(--fx1);background:color-mix(in srgb,var(--fx1) 18%,transparent);color:var(--ink);animation:popin .35s both}
.seat.conf{background:var(--fx1);color:#1E1400;border-style:solid;border-color:var(--fx1)}
.seat.apol{border-style:solid;border-color:var(--warn);color:var(--warn);text-decoration:line-through;opacity:.7}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:.86rem}
.timeline li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.timeline .i{width:20px;height:20px}
.timeline .w{font-size:.72rem;color:var(--muted)}
.chipst{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.st-on{background:var(--brand-soft);color:var(--ok)}
.st-idle{background:var(--gold-soft);color:var(--gold-ink)}
.st-del{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th,.tbl td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:500}
.tbl .idtag{font-size:.74rem}
.flag-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.flag-row > span{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem;min-width:0}
.flag-row .i{width:24px;height:24px;flex:none}
.flag-row .seg{width:150px;flex:none}
.photo-cv{width:200px;height:200px;max-width:100%;border-radius:50%;margin-inline:auto;display:block;background:var(--hero);box-shadow:0 0 0 4px var(--fx1)}
.day-h{font-size:.78rem;color:var(--muted);text-align:center;margin-top:8px}
.hist{display:flex;flex-direction:column;gap:6px}
.admin-card{display:flex;gap:12px;align-items:center;border:0;border-radius:22px;padding:14px;background:var(--hero);color:var(--hero-ink);text-align:start;width:100%}
.admin-card .i{width:32px;height:32px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:center;display:grid}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--brand);font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted)}
.plan ul{margin:0;padding-inline-start:18px;font-size:.88rem;color:var(--muted)}
.plat{display:flex;gap:12px;align-items:center}
.plat .sh-ic{width:46px;height:46px;flex:none}
.plat > div{display:grid;min-width:0;flex:1}
.inline-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.inline-in input{width:90px}

.inst{position:absolute;top:8px;inset-inline:12px;z-index:39;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 14px 34px -14px rgba(20,10,60,.45);animation:drop .45s cubic-bezier(.2,1.3,.4,1) both}
.inst img{width:44px;height:auto;flex:none}
.inst-t{flex:1;min-width:0;display:grid;line-height:1.4}
.inst-t b{font-size:.92rem}
.inst-t small{font-size:.76rem;color:var(--muted)}
.inst .btn-brand{padding:8px 14px;flex:none}
.inst-x{border:0;background:transparent;color:var(--muted);font-size:1rem;padding:4px;flex:none}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
/* Password eye, remember me, charts */
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-left:46px!important}
.pw-eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;border-radius:10px}
.pw-eye .i{width:21px;height:21px}
.remember{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
.remember input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .bar{fill:color-mix(in srgb,var(--brand) 45%,transparent)}
.chart .bar.hi{fill:var(--brand)}
.chart .ax{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.bl{display:grid;gap:9px}
.bl-row{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.bl-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-t{height:10px;border-radius:99px;background:var(--bubble);overflow:hidden}
.bl-t i{display:block;height:100%;border-radius:99px;background:linear-gradient(270deg,var(--fx2),var(--fx1))}
.bl-row b{font-variant-numeric:tabular-nums;font-size:.8rem}
.plan-ul{margin:0;padding-inline-start:18px;font-size:.88rem;display:grid;gap:4px}
.notice-card{display:flex;gap:12px;align-items:center;border:1px solid var(--gold);background:var(--gold-soft);border-radius:20px;padding:12px 14px;text-align:start;width:100%;color:var(--ink)}
.notice-card .i{width:28px;height:28px;flex:none}
/* Share card */
.mycard{position:relative;border-radius:26px;padding:18px;color:#FFFFFF;background:linear-gradient(135deg,#1E1B38 0%,#3A2580 55%,#1E3A8A 100%);overflow:hidden;display:grid;gap:12px;box-shadow:0 20px 40px -24px rgba(40,20,120,.7)}
.mycard::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(230,179,112,.35),transparent 70%);top:-80px;left:-60px}
.mc-top{position:relative;display:flex;justify-content:space-between;align-items:center}
.mc-brand{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:1.3rem}
.mc-brand img{height:30px;width:auto}
.mc-id{direction:ltr;font-size:.78rem;background:rgba(255,255,255,.14);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.mc-body{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
.mc-who{display:grid;gap:6px;min-width:0}
.mc-who .nm{font-size:1.5rem;font-weight:700;line-height:1.2}
.mc-who .sub{font-size:.82rem;color:#C9C3EE}
.mc-stats{display:flex;gap:14px;font-size:.8rem;color:#C9C3EE;flex-wrap:wrap}
.mc-stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.25rem;color:#E6B370}
.mc-tags{display:flex;gap:6px;flex-wrap:wrap}
.mc-tags span{font-size:.72rem;background:rgba(255,255,255,.14);border-radius:99px;padding:2px 9px}
.mc-qr{background:#FFFFFF;border-radius:14px;padding:7px;display:grid;justify-items:center;gap:2px;color:#1E1B38;font-size:.62rem;font-weight:700}
.mc-qr svg{width:92px;height:92px;display:block}
.share-row{display:grid;gap:10px}
/* Identity colours on tiles: purple, blue, gold */
.tiles .tile:nth-child(3n+1){--tc:#8B5CF6}
.tiles .tile:nth-child(3n+2){--tc:#3B82F6}
.tiles .tile:nth-child(3n){--tc:#E6B370}
.tiles .tile .ic{background:color-mix(in srgb,var(--tc,var(--fx1)) 20%,var(--surface))}
.tiles .tile .i .ac{fill:var(--tc,var(--fx1))}
.tiles .tile .i .acs{stroke:var(--tc,var(--fx1))}
.tiles .tile .i .soft{fill:color-mix(in srgb,var(--tc,var(--fx1)) 30%,transparent)}
.tiles .tile.on::after{background:var(--tc,var(--fx1));box-shadow:0 0 0 4px color-mix(in srgb,var(--tc,var(--fx1)) 25%,transparent)}
.terms-body{max-height:60vh;overflow-y:auto;display:grid;gap:10px;font-size:.88rem;line-height:1.8}
.terms-body h4{margin:6px 0 0;font-size:.95rem}
.terms-body p{margin:0;color:var(--ink)}
.notice-card{box-sizing:border-box}
.notice-card > span{flex:1;min-width:0}
.notice-card .chip{flex:none;white-space:nowrap}
/* Celebration overlay */
.celebrate{position:absolute;inset:0;z-index:30;display:grid;place-items:center;align-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.cel-core{position:relative;width:160px;height:160px;display:grid;place-items:center}
.cring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--fx1);opacity:0}
.cring.r2{border-color:var(--fx2)}
.go .r1{animation:ringout 1.2s ease-out .05s}
.go .r2{animation:ringout 1.2s ease-out .25s}
.go .r3{animation:ringout 1.2s ease-out .45s}
@keyframes ringout{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.check{width:104px;height:104px}
.check .c{fill:var(--fx1);transform-box:fill-box;transform-origin:center}
.go .check .c{animation:popc .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popc{from{transform:scale(0)}to{transform:scale(1)}}
.check .k{fill:none;stroke:#FFFFFF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.go .check .k{animation:drawk .45s .35s ease-out forwards}
@keyframes drawk{to{stroke-dashoffset:0}}
.cel-pts{font-family:var(--f-display);font-weight:400;font-size:2.8rem;line-height:1;color:var(--fx1);direction:ltr;unicode-bidi:isolate}
.go .cel-pts{animation:rise .6s .4s both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.cel-txt{font-weight:700;font-size:1.15rem;text-align:center;max-width:80%}
.go .cel-txt{animation:rise .6s .6s both}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:31}
.toast{position:absolute;top:64px;inset-inline:0;margin-inline:auto;width:max-content;max-width:80%;z-index:40;background:var(--fx1);color:#1E1400;font-weight:700;border-radius:99px;padding:6px 16px;font-size:.9rem;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.check .k{stroke-dashoffset:0}.cring{opacity:0}}

/* v21 layout */
.main{grid-auto-rows:max-content}
.main>*{min-height:min-content}
.hero-card{min-height:150px;padding:16px 18px}
.hero-card .ring{width:108px;height:108px}
.hero-txt b{font-size:1.12rem;line-height:1.6}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{gap:6px;padding:12px 4px 10px;border-radius:18px;font-size:.78rem;line-height:1.35}
.tile .ic{width:48px;height:48px;border-radius:15px}
.tile .ic .i{width:26px;height:26px}
.tile>span:nth-child(2){font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--tc,var(--fx1)) 14%,transparent);border-radius:8px;padding:1px 7px;max-width:100%}
.tile .sub{font-size:.62rem;margin-top:-2px;line-height:1.3}
.tile .sub.soon{padding:0 7px;margin-top:-2px}
.tile.on::after{top:8px;inset-inline-start:8px;width:8px;height:8px}
.mycard.mini{padding:12px 14px;gap:8px;border-radius:22px;cursor:pointer}
.mycard.mini .mc-brand{font-size:1rem}.mycard.mini .mc-brand img{height:22px}
.mycard.mini .mc-id{font-size:.68rem}
.mycard.mini .mc-who{gap:3px}.mycard.mini .mc-who .nm{font-size:1.1rem}.mycard.mini .mc-who .sub{font-size:.72rem}
.mycard.mini .mc-stats{gap:10px;font-size:.68rem}.mycard.mini .mc-stats b{font-size:1rem}
.mycard.mini .mc-tags span{font-size:.64rem;padding:1px 7px}
.mycard.mini .mc-qr{padding:5px;font-size:.55rem;border-radius:10px}.mycard.mini .mc-qr svg{width:64px;height:64px}
.mc-share{display:flex;gap:4px;align-items:center;font-size:.68rem;background:rgba(255,255,255,.16);border-radius:99px;padding:2px 9px}
.mc-share .i{width:13px;height:13px}
.mycard.mini .mc-body{padding-bottom:4px}
.dev-input{align-items:flex-end}
.dev-input textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:11px 14px;font:inherit;line-height:1.6;resize:vertical;min-height:8.5em;color:var(--ink)}

/* v22 */
.chat-input{align-items:flex-end}
.main>*{min-width:0}
.chat-input textarea.msgbox,.dev-input textarea{width:0}
.chat-input textarea.msgbox{flex:1;min-width:0;border:2px solid #8B5CF6;background:var(--surface);border-radius:22px;padding:10px 16px;font:inherit;line-height:1.6;color:var(--ink);resize:none;overflow-y:auto;box-sizing:border-box;height:calc(5 * 1.6em + 24px);transition:none}
.dev-input textarea{box-sizing:border-box;resize:none;height:calc(5 * 1.6em + 26px);min-height:0}
.chat-input input,.dev-input textarea{border:2px solid #8B5CF6!important}
.chat-input textarea.msgbox:focus,.dev-input textarea:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,#8B5CF6 22%,transparent)}
.tiles .tile:nth-child(9n+1),.tiles .tile:nth-child(9n+6),.tiles .tile:nth-child(9n+8){--tc:#8B5CF6}
.tiles .tile:nth-child(9n+2),.tiles .tile:nth-child(9n+4),.tiles .tile:nth-child(9n+9){--tc:#3B82F6}
.tiles .tile:nth-child(9n+3),.tiles .tile:nth-child(9n+5),.tiles .tile:nth-child(9n+7){--tc:#E6B370}

/* v25: app background (gender default, presets, own photo) */
:root[data-bgk="sky"]{--bg:#DCEBF6;--bg-art:linear-gradient(180deg,#C6E4FA 0%,#D6EAF8 45%,#E6EAF2 72%,#F9DCCB 100%)}
:root[data-bgk="rose"]{--bg:#F7DEE0;--bg-art:linear-gradient(180deg,#F9CFE0 0%,#F9DCE6 30%,#FAE1D6 62%,#FAD3BE 100%)}
:root[data-bgk="mint"]{--bg:#DDF1EA;--bg-art:linear-gradient(180deg,#CDEFE3 0%,#DDF2EC 45%,#EAF1EE 72%,#F7E6CF 100%)}
:root[data-bgk="lav"]{--bg:#E7E1F7;--bg-art:linear-gradient(180deg,#DCD2FA 0%,#E6E0F8 45%,#EEE9F5 72%,#F8E1EC 100%)}
:root[data-bgk]{--surface:#FFFFFF}
:root[data-bgk="photo"]{--bg:#F2F0F6;--surface:#FFFFFF;--bg-art:linear-gradient(rgba(255,255,255,.58),rgba(255,255,255,.58)),var(--bg-img)}
.app{background-image:var(--bg-art,none);background-size:cover;background-position:center;background-repeat:no-repeat}
.chat-input{background:transparent}
.tiles .tile:nth-child(9n+3),.tiles .tile:nth-child(9n+5),.tiles .tile:nth-child(9n+7){--tc:#D8952F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg-art:none;--bg:#0F0C29;--surface:#1E1B38}
 :root:not([data-theme="light"])[data-bgk="photo"]{--bg-art:linear-gradient(rgba(15,12,41,.72),rgba(15,12,41,.72)),var(--bg-img)}
 :root:not([data-theme="light"]) .tiles .tile:nth-child(9n+3),:root:not([data-theme="light"]) .tiles .tile:nth-child(9n+5),:root:not([data-theme="light"]) .tiles .tile:nth-child(9n+7){--tc:#E6B370}}
:root[data-theme="dark"]{--bg-art:none;--bg:#0F0C29;--surface:#1E1B38}
:root[data-theme="dark"][data-bgk="photo"]{--bg-art:linear-gradient(rgba(15,12,41,.72),rgba(15,12,41,.72)),var(--bg-img)}
:root[data-theme="dark"] .tiles .tile:nth-child(9n+3),:root[data-theme="dark"] .tiles .tile:nth-child(9n+5),:root[data-theme="dark"] .tiles .tile:nth-child(9n+7){--tc:#E6B370}
.bg-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bg-pick{display:grid;gap:6px;justify-items:center;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 4px;font-size:.75rem;font-weight:700;color:var(--ink)}
.bg-pick[aria-pressed="true"]{border-color:#8B5CF6;box-shadow:0 0 0 3px color-mix(in srgb,#8B5CF6 22%,transparent)}
.bg-pick .bgsw{width:100%;height:56px;border-radius:11px;background-size:cover;background-position:center;border:1px solid var(--line);display:grid;place-items:center}
.bg-pick .bgsw .i{width:24px;height:24px}

/* v26: fixed frame colour for top bar and bottom bar */
:root{--frame:#262046;--frame-ink:#FFFFFF;--frame-muted:#BDB6E6}
.app>.top{background:var(--frame);color:var(--frame-ink);border-radius:0 0 22px 22px;padding-block:12px 12px;margin-bottom:6px;box-shadow:0 10px 24px -18px rgba(20,10,60,.8)}
.app>.top .who small{color:var(--frame-muted)}
.app>.top .bell{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#FFFFFF}
.app>.top .pts{background:rgba(230,179,112,.2);color:#F2C88A}
.nav{background:var(--frame);border-top:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 24px -18px rgba(20,10,60,.8)}
.nav button{color:var(--frame-muted)}

.bk-board{direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;border-radius:18px;background:var(--frame,#262046);box-shadow:0 0 0 4px color-mix(in srgb,#8B5CF6 35%,transparent)}

.bk-board .bc.gem{aspect-ratio:1}
.bk-board .bc.pop{animation:bkpop .26s ease-in forwards}

.bk-pc{display:grid;gap:2px;touch-action:none;cursor:grab;padding:8px;border-radius:12px}
.bk-pc .gem{width:var(--ps);height:var(--ps)}
.bk-ghost{direction:ltr;position:fixed;left:0;top:0;z-index:60;display:grid;gap:3px;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.bk-over{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;border-radius:18px;background:rgba(20,14,50,.82);color:#FFFFFF;text-align:center}

.bk-board .bc.fall{animation:bkfall .32s cubic-bezier(.3,1.4,.6,1)}
@keyframes bkfall{from{transform:translateY(calc(var(--dy) * -100% - var(--dy) * 3px))}to{transform:none}}
.bk-float{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-display);font-size:2rem;color:#FFFFFF;text-shadow:0 2px 0 #5B2DB0,0 0 14px rgba(139,92,246,.9);pointer-events:none;animation:bkfl 1.1s ease-out forwards;white-space:nowrap;z-index:3}
.bk-float.combo{color:#FCE7B5;text-shadow:0 2px 0 #9A5A0B,0 0 14px rgba(230,169,58,.9);top:28%}

.rec-box{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.rec-box>b{display:flex;gap:6px;align-items:center}.rec-box>b .i{width:20px;height:20px}

  function drawShape(c,shape,s,color){

      const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='';

  function sendChat(t){
    if(chatBusy||!t)return;
    addMsg('me',t); pushChat('user',t);
    const bored=/(طفش|زهق|ملل|مليت|روتين)/.test(t), userTurns=S.chat.filter(x=>x.role==='user').length;
    chatBusy=true; const sb=$('#chatSend'); if(sb)sb.disabled=true;
    const bubble=addMsg('bot typing',aiReady()?'يفكر...':'يكتب...');
    function finish(text){
      if(bubble){bubble.className='msg bot';bubble.textContent=text}
      pushChat('assistant',text);
      if((bored||userTurns>=3)&&!offered){
        offered=true; const m=addMsg('bot',G('وإذا تبي تكسر الروتين، جرّب «امسك النجمة».','وإذا تبين تكسرين الروتين، جرّبي «امسك النجمة».'));
        if(m){const b=document.createElement('button');b.type='button';b.className='btn-gold';b.dataset.go='home/catch';b.innerHTML=icon('star')+'<span>يلا نلعب</span>';m.appendChild(b)}
      }
      chatBusy=false; const s2=$('#chatSend'); if(s2)s2.disabled=false;
    }
    if(!aiReady()){setTimeout(()=>finish(fallback(t)),650);return}
    const turns=[{role:'user',content:chatRules()}].concat(S.chat.slice(-16).map(x=>({role:x.role,content:x.content})));
    sample(turns,{modelTier:'quick',cache:false,onText:u=>{if(bubble){bubble.className='msg bot';bubble.textContent=clean(u.text)||'...';bubble.scrollIntoView({block:'end'})}}})

  }

      e.preventDefault(); const name=$('#pName').value.trim(); if(!name){$('#pName').focus();toast('اكتب اسمك أول');return}
      const city=$('#pCity').value==='other'?($('#pCityO').value.trim()||'مدينتي'):$('#pCity').value, first=S.demo;
      S.profile={name,gender,city,custom:parseCustom($('#pCustom')?$('#pCustom').value:''),interests:$$('#pInts [aria-pressed="true"]').map(b=>b.dataset.i),team:$('#pTeam').value.trim(),goal:$('#pGoal').value.trim(),about:$('#pAbout').value.trim()};
      S.contact=($('#pContact')?$('#pContact').value.trim():S.contact);
      if(first){S.demo=false;S.log=[];S.memory=[];S.chat=[];S.points=0;S.joined=false;offered=false;lastReply=null;
        S.uid=newId();S.registry=[{id:S.uid,status:'يعمل',since:today()}];S.friends=[];S.referred=[];S.meetups=[];S.reports=[];S.history=[];S.notifs=[];S.tasks={};S.avatar=null;photoImg=null}
      recordAccount(); store.ready=true; renderChrome(); flush(); setTimeout(()=>task('profile'),first?2300:0);
      if(first){celebrate(G('أهلاً '+name+'! ملفك جاهز','أهلاً '+name+'! ملفك جاهز'),100);addPoints(100,true);go('home')}
      else{toast('انحفظ ملفك');render()}
    });
  }
  function wireInvite(){
    $('#copyBtn').addEventListener('click',function(){
      const b=this, code=$('#invLink');
      const sel=()=>{const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='حدده وانسخه'};
      try{navigator.clipboard.writeText('https://'+code.textContent).then(()=>{b.textContent='انتسخ'},sel)}catch(e){sel()}
    });
    $('#simJoin').addEventListener('click',function(){
      if(S.joined)return; S.joined=true;
      const nn=pick(MALE.concat(FEMALE)); S.referred.push({id:newId(),name:nn}); setTimeout(()=>notify(nn+' سجّل من رابطك. تقدر تضيفه من المجتمع','people'),2200);
      celebrate(G('صديقك فعّل حسابه! وله 100 ترحيب','صديقتك فعّلت حسابها! ولها 100 ترحيب'),500); addPoints(500,true);
      this.disabled=true; this.textContent='تمت الدعوة'; save();
    });
  }
  function wireSettings(){
    $$('#sndSeg [data-s]').forEach(b=>b.addEventListener('click',()=>{S.sound=b.dataset.s==='1';$$('#sndSeg [data-s]').forEach(x=>x.setAttribute('aria-checked',String(x===b)));save();chime('pop')}));
  }

  /* ---------- Boot ---------- */
  applyTheme(); renderChrome(); render(); load(); setTimeout(()=>{let alive='';try{alive=sessionStorage.getItem('mn-alive')}catch(e){}if(lsGet('mn-sess')&&!alive&&!S.demo){logout(true);return}try{sessionStorage.setItem('mn-alive','1')}catch(e){}recordAccount();showWelcome()},900);
})();
</script>

</html>
